name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 無料プランはCPU時間が少ないので、ライブラリはここで入れてから送る
      - name: install
        run: pip install -r requirements.txt --target packages

      - name: check
        run: PYTHONPATH=packages python -c "import app"

      - name: zip
        run: zip -qr release.zip app.py storage.py requirements.txt templates static packages -x "*/__pycache__/*"

      - uses: azure/webapps-deploy@v3
        with:
          app-name: dotchiha
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: release.zip
